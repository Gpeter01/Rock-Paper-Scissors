<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="script.js"></script> -->
</head>
<body>
    <h1 id="gameheader">Rock Paper Scissors</h1>
    <h2 class="theround">Round 1</h2>
    <div class="container-option">
        <button class="option rock">Rock</button>
        <button class="option paper">Paper</button>
        <button class="option scissors">Scissors</button>
    </div>
    <h3 class="per-round">You lose!!</h3>
    <div class="containscore">
        <div class="output user">
            <p class="user-display">Player</p>
            <p class="main-output user">Score</p>
        </div>
        <div class="output computer">
            <p class="computer-display">Computer</p>
            <p class="main-output computer">Score</p>
        </div>
    </div>
    <p class="result">Congrats, you win!!</p>
    <button class="restart">Restart Game</button>
</body>
</html>
